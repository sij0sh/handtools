name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: validate manifests and hygiene
        run: python3 scripts/validate.py

  mise:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: untangle
            tasks: check
          - skill: foundation
            tasks: lint test build
          - skill: simple-by-design
            tasks: check
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: install pinned tools
        working-directory: plugins/${{ matrix.skill }}/skills/${{ matrix.skill }}
        run: mise install
      - name: run skill tasks
        working-directory: plugins/${{ matrix.skill }}/skills/${{ matrix.skill }}
        run: |
          for task in ${{ matrix.tasks }}; do
            mise run "$task"
          done

  untangle-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: unittest on Python 3.9
        working-directory: plugins/untangle/skills/untangle
        run: python -m unittest discover -s tests -v

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - semantic-instructions
          - workflows-as-skills
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: unittest
        working-directory: plugins/${{ matrix.skill }}/skills/${{ matrix.skill }}
        run: python -m unittest discover -s tests -v

  remember:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install requirements
        working-directory: plugins/remember/skills/remember
        run: python -m pip install -r requirements.txt
      - name: unittest
        working-directory: plugins/remember/skills/remember
        run: python -m unittest discover -s tests -v
